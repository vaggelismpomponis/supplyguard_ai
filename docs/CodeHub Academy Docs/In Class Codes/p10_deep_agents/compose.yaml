services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training_local_only
      POSTGRES_DB: agents
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agent_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d agents"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  agent_data:
