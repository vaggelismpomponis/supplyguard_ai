services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
      POSTGRES_DB: vectorstore
    ports:
      - "5445:5432"   # 5445: units 18/20/43 already use 5442/5433/5444
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
